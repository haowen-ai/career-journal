<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Job Search Ops dashboard preview</title>
  <desc id="desc">A local dashboard showing application search, status filters, and three example job application cards</desc>
  <defs>
    <radialGradient id="page" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#dbead8"/>
      <stop offset="0.48" stop-color="#f3f5ef"/>
      <stop offset="1" stop-color="#f3f5ef"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#273626" flood-opacity="0.08"/>
    </filter>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172016 }
      .serif { font-family: Georgia, "Times New Roman", serif; fill: #172016 }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace }
      .muted { fill: #657063 }
      .label { fill: #768073; font-size: 14px; font-weight: 700; letter-spacing: 1px }
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#page)"/>
  <rect x="46" y="42" width="1348" height="816" rx="22" fill="#f8faf5" stroke="#cad2c4"/>

  <g class="ui">
    <text x="112" y="112" class="mono" fill="#587050" font-size="16" font-weight="700" letter-spacing="2">LOCAL WORKSPACE</text>
    <text x="112" y="190" class="serif" font-size="70" font-weight="700" letter-spacing="-3">Job Search Ops</text>
    <text x="112" y="232" class="muted" font-size="22">Applications, evidence, materials, and next actions in one place</text>

    <rect x="1110" y="164" width="94" height="34" rx="17" fill="#e9e3ce"/>
    <text x="1134" y="186" fill="#685d34" font-size="14" font-weight="700">Draft</text>
    <rect x="1216" y="164" width="112" height="34" rx="17" fill="#d4e9dd"/>
    <text x="1234" y="186" fill="#285b41" font-size="14" font-weight="700">Submitted</text>
    <line x1="112" y1="278" x2="1328" y2="278" stroke="#cad2c4"/>

    <text x="112" y="326" fill="#526050" font-size="15" font-weight="700">Search</text>
    <rect x="112" y="342" width="590" height="54" rx="11" fill="#fff" stroke="#b8c2b3"/>
    <text x="132" y="375" fill="#858f82" font-size="16">Company or role</text>
    <text x="724" y="326" fill="#526050" font-size="15" font-weight="700">Status</text>
    <rect x="724" y="342" width="280" height="54" rx="11" fill="#fff" stroke="#b8c2b3"/>
    <text x="744" y="375" fill="#526050" font-size="16">All statuses</text>
    <path d="M973 363l8 8 8-8" fill="none" stroke="#526050" stroke-width="2"/>
    <rect x="1026" y="342" width="132" height="54" rx="11" fill="#203c2b"/>
    <text x="1058" y="375" fill="#fff" font-size="16" font-weight="700">Refresh</text>

    <text x="112" y="448" class="muted" font-size="17">3 of 3 applications</text>

    <g filter="url(#shadow)">
      <rect x="112" y="478" width="382" height="268" rx="18" fill="#fff" stroke="#d2d8cd"/>
      <text x="138" y="522" fill="#647160" font-size="14" font-weight="700" letter-spacing="1">NORTHSTAR AI</text>
      <text x="138" y="560" class="serif" font-size="25" font-weight="700">AI Solutions Engineer</text>
      <rect x="392" y="503" width="76" height="30" rx="15" fill="#e1e9dc"/>
      <text x="410" y="523" fill="#34502f" font-size="13" font-weight="700">applied</text>
      <text x="138" y="620" class="label">STAGE</text>
      <text x="138" y="649" font-size="16">Application review</text>
      <text x="320" y="620" class="label">APPLIED</text>
      <text x="320" y="649" font-size="16">Sep 18, 2026</text>
      <text x="138" y="704" class="mono muted" font-size="13">northstar-ai-solutions-engineer</text>

      <rect x="529" y="478" width="382" height="268" rx="18" fill="#fff" stroke="#d2d8cd"/>
      <text x="555" y="522" fill="#647160" font-size="14" font-weight="700" letter-spacing="1">HELIX LABS</text>
      <text x="555" y="560" class="serif" font-size="25" font-weight="700">Data Science Intern</text>
      <rect x="805" y="503" width="80" height="30" rx="15" fill="#e1e9dc"/>
      <text x="821" y="523" fill="#34502f" font-size="13" font-weight="700">screen</text>
      <text x="555" y="620" class="label">STAGE</text>
      <text x="555" y="649" font-size="16">Video interview</text>
      <text x="737" y="620" class="label">APPLIED</text>
      <text x="737" y="649" font-size="16">Sep 16, 2026</text>
      <text x="555" y="704" class="mono muted" font-size="13">helix-labs-data-science-intern</text>

      <rect x="946" y="478" width="382" height="268" rx="18" fill="#fff" stroke="#d2d8cd"/>
      <text x="972" y="522" fill="#647160" font-size="14" font-weight="700" letter-spacing="1">ORBIT SYSTEMS</text>
      <text x="972" y="560" class="serif" font-size="25" font-weight="700">AI Product Intern</text>
      <rect x="1223" y="503" width="79" height="30" rx="15" fill="#e9e3ce"/>
      <text x="1243" y="523" fill="#685d34" font-size="13" font-weight="700">draft</text>
      <text x="972" y="620" class="label">STAGE</text>
      <text x="972" y="649" font-size="16">Materials ready</text>
      <text x="1154" y="620" class="label">APPLIED</text>
      <text x="1154" y="649" font-size="16">Not submitted</text>
      <text x="972" y="704" class="mono muted" font-size="13">orbit-systems-ai-product-intern</text>
    </g>

    <text x="112" y="808" class="muted" font-size="14">Example data · http://job-search-ops.localhost:4173</text>
  </g>
</svg>
