schema_version: 1
dependencies:
  career-ops:
    required: false
    required_for:
      - resume-generation
      - cover-letter-generation
    source: https://github.com/career-ops-hq/career-ops
    version: "1.32.0"
    license: MIT
    adapter_entrypoint: career-journal-adapter.mjs
    legacy_adapter_entrypoint: jobops-adapter.mjs
    legacy_adapter_through: "0.1.0-alpha.5"
  pdf:
    required: false
    required_for:
      - rendered-pdf-verification
  documents:
    required: false
    required_for:
      - docx-generation
  email:
    required: true
    required_for:
      - completed-onboarding
      - daily-progress-review
    providers:
      verified: imap-tls
      verified_host: trusted-host
      import_only_without_verification: host-managed
    access: read-only
    account_verification: live-required
    initial_sync: required
    execution_envelope: required
    freshness_hours: 36
    credential_storage: environment-reference-only
  automation:
    required: true
    required_for:
      - completed-onboarding
      - daily-progress-review
    external_registration: required
    matching_external_run: required
    freshness_hours: 36
    default_schedule:
      mail-sync: "20:00"
      deadline-review: "20:15"
    optional_commands:
      - backup-create
    timezone: computer-detected-iana
  wiki:
    required: false
  jev:
    required: false
    required_for:
      - semantic-email-classification
    source: https://github.com/typesafe-ai/skills
    api_docs: https://docs.typesafe.ai/api
    access_state: user-configured
    role: primary-semantic-decision-engine
    agent_fallback: deterministic-rules-then-current-agent-review
    standalone_fallback: deterministic-rules-then-structured-llm-then-manual-review
